<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BiteLens Optical Telemetry</title>
  <meta name="description" content="Log in to your BiteLens account or continue with Google to access personalized health scores, scan history, and goal telemetry.">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="bitelens-splash-screen"></div>
  <div id="site-header-container"></div>

  <main>
    <section class="section" style="padding: 4rem 0;">
      <div class="container" style="max-width: 480px;">
        
        <div class="calculator-card" style="margin: 0; padding: 2.5rem;">
          
          <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 58px; height: 58px; background: rgba(59, 122, 87, 0.12); border-radius: 18px; border: 1.5px solid rgba(59, 122, 87, 0.3); color: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem; box-shadow: var(--shadow-sm);">
              <i data-lucide="log-in" style="width: 1.85rem; height: 1.85rem;"></i>
            </div>
            <h1 style="font-size: 1.95rem; margin-bottom: 0.35rem;">Welcome Back</h1>
            <p style="font-size: 0.92rem; color: var(--color-text-muted);">
              Log in to access your personal dietary telemetry & scan history.
            </p>
          </div>

          <div id="auth-error" style="display: none; background: #FEE2E2; color: #991B1B; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1.25rem; border: 1px solid #FCA5A5; font-weight: 600;"></div>

          <!-- Official Google OAuth Login Button -->
          <button id="google-login-btn" type="button" class="btn btn-outline" style="width: 100%; padding: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; font-size: 0.95rem; font-weight: 700; margin-bottom: 1.5rem;">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
          </button>

          <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
            <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
            <span style="font-size: 0.78rem; color: var(--color-text-muted); font-weight: 700; text-transform: uppercase;">OR WITH EMAIL</span>
            <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
          </div>

          <!-- Email Login Form -->
          <form id="login-form">
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <input type="email" id="login-email" class="form-input" placeholder="user@gmail.com" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="login-goal">Primary Health Objective</label>
              <select id="login-goal" class="form-select">
                <option value="Fat Loss Deficit">Weight Control & Fat Loss</option>
                <option value="Hypertrophy (High Protein)">Muscle Gain & High Protein</option>
                <option value="General Wellness">Clean Whole Food Nutrition</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 1rem; margin-top: 0.5rem;">
              Log In to BiteLens
            </button>
          </form>

          <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--color-text-muted);">
            Don't have an account? <a href="signup.html" style="font-weight: 700; color: var(--color-primary);">Create Free Account</a>
          </div>

        </div>

      </div>
    </section>
  </main>

  <div id="site-footer-container"></div>

  <script type="module" src="./js/components.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
